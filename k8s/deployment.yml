apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-prediction
spec:
  replicas: 3
  selector:
    matchLabels:
      app: energy-pred
  template:
    metadata:
      labels:
        app: energy-pred
    spec:
      containers:
      - name: energy-pred
        image: pratisharya/energy_cons_pred:1.2
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: energy-pred-service
spec:
  type: LoadBalancer
  selector:
    app: energy-pred
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000