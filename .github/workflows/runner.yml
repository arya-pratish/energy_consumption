name: Build the image
on: workflow_dispatch

jobs:
  Pipeline:
    name: CI pipeline 
    runs-on: self-hosted
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
            username: ${{secrets.DOCKER_HUB_USERNAME}}
            password: ${{secrets.DOCKER_HUB_PASSWORD}}

      - name: Build and Push to docker hub
        run: |
          cd ml_model
          docker build . -t pratisharya/energy_cons_pred:1.0
          docker push pratisharya/energy_cons_pred:1.0
  
  PullandRunImage:
    runs-on: self-hosted
    steps:
      - name: push image from docker hub
        run: |
          docker pull pratisharya/energy_cons_pred:latest
          docker run pratisharya/energy_cons_pred:latest

