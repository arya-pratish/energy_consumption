name: Build and push the image to docker hub
on: workflow_dispatch

jobs:
  Pipeline:
    name: CI pipeline 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
            username: ${{secrets.DOCKER_HUB_USERNAME}}
            password: ${{secrets.DOCKER_HUB_PASSWORD}} 

   #   - name: Bump version and push tag
   #     uses: anothrNick/github-tag-action@v1
    #    env:
    #      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #      DEFAULT_BUMP: minor

      - name: Set variable
        run: |
          echo "Version_Tag=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "Image_Tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo $GITHUB_REF##*
      - name: Build and Push to docker hub
        run: |
          cd ml_model
          docker build . -t pratisharya/energy_cons_pred:1.0
          docker push pratisharya/energy_cons_pred:1.0
 #         docker build . -t pratisharya/energy_cons_pred:${{ env.Image_Tag}} -t pratisharya/energy_cons_pred:latest
 #         docker push pratisharya/energy_cons_pred:${{ env.Image_Tag}}
  #        docker push pratisharya/energy_cons_pred:latest
  
  