name: Build and push the image to docker hub
on: workflow_dispatch

jobs:
  Pipeline:
    name: CI pipeline 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
            username: ${{secrets.DOCKER_HUB_USERNAME}}
            password: ${{secrets.DOCKER_HUB_PASSWORD}} 

      - name: Set variable
        run: |
          echo "Version_Tag=$(echo $GITHUB_SHA | cut -c 1-6)" >> $GITHUB_ENV
          echo "Image_Tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Build and Push to docker hub
        run: |
          cd ml_model
          docker build . -t pratisharya/energy_cons_pred:${{ env.Version_Tag}} -t pratisharya/energy_cons_pred:${{ env.Image_Tag}}
          docker push pratisharya/energy_cons_pred:${{ env.Version_Tag}}
  #        docker push pratisharya/energy_cons_pred:latest
  
  