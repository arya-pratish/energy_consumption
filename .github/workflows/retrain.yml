name: pythonworkflow
on: workflow_dispatch

jobs:
        datapipeline:
                name: data_pipeline
                runs-on: ubuntu-latest
                steps:
                        - name: Checkout code
                          uses: actions/checkout@v4

                        - name: install python
                          uses: actions/setup-python@v4
                          with:
                                  python-version: '3.10'

                        - name: install requirements module
                          run: |
                                cd ml_model
                                pip install -r requirements.txt

                        - name: clean_data
                          run: |

                                cd test
                                cp ./ml_model/data.csv .
                                python Unit_test.py